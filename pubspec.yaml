name: flutter_setup_assistant
description: One-click Flutter development environment installer for macOS and Windows.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5
  http: ^1.6.0
  path: ^1.9.1
  crypto: ^3.0.7
  url_launcher: ^6.3.3
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
